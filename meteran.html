<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebXR AR Measuring Tape</title>

    <!-- Tailwind CSS untuk UI Overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-white m-0 overflow-hidden font-sans">

    <!-- UI Overlay di atas tampilan AR -->
    <div id="ar-ui" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        <!-- Header Info -->
        <header class="bg-slate-900/80 backdrop-blur-md border border-slate-800 p-4 rounded-2xl pointer-events-auto text-center shadow-xl">
            <h1 class="font-extrabold text-sm text-amber-400">WebXR AR Meteran Digital</h1>
            <p id="instruction-text" class="text-xs text-slate-300 mt-1">Arahkan kamera ke lantai hingga lingkaran putih muncul, lalu ketuk untuk mulai.</p>
        </header>

        <!-- Panel Hasil Ukur & Tombol Reset -->
        <div class="space-y-3 pointer-events-auto max-w-sm mx-auto w-full">
            <div id="distance-card" class="bg-slate-900/90 backdrop-blur-md border border-amber-500/40 p-4 rounded-2xl text-center shadow-2xl hidden">
                <span class="text-[10px] text-slate-400 uppercase tracking-widest font-bold">Jarak Terukur</span>
                <div id="distance-output" class="text-3xl font-black text-amber-400">0.00 cm</div>
            </div>

            <button id="btn-reset" class="w-full bg-slate-800/90 hover:bg-slate-700 text-white font-bold py-3 rounded-xl border border-slate-700 text-xs shadow-lg transition hidden">
                <i class="fa-solid fa-rotate-right mr-1.5"></i> Reset Pengukuran
            </button>
        </div>
    </div>

    <!-- Tombol Mulai Sesi AR (Karena WebXR wajib dipicu interaksi pengguna) -->
    <div id="start-overlay" class="absolute inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center space-y-4">
        <div class="bg-amber-500 text-slate-950 p-4 rounded-2xl text-2xl font-black shadow-lg shadow-amber-500/20">
            <i class="fa-solid fa-ruler"></i>
        </div>
        <div class="space-y-1">
            <h2 class="text-lg font-bold">AR Measuring Tape</h2>
            <p class="text-xs text-slate-400 max-w-xs">Ukur jarak antar sudut ruangan langsung dari browser HP Anda menggunakan teknologi WebXR.</p>
        </div>
        <button id="btn-start-ar" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-6 py-3.5 rounded-xl text-xs uppercase tracking-wider shadow-xl transition">
            Mulai Sesi AR
        </button>
    </div>

    <!-- Script Utama Three.js & WebXR -->
    <script type="module">
        let container;
        let camera, scene, renderer;
        let controller;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        // Variabel Pengukuran Meteran
        let pointA = null;
        let pointB = null;
        let measuringLine = null;
        let markerMeshA = null;
        let markerMeshB = null;

        const instructionText = document.getElementById('instruction-text');
        const distanceCard = document.getElementById('distance-card');
        const distanceOutput = document.getElementById('distance-output');
        const btnReset = document.getElementById('btn-reset');
        const startOverlay = document.getElementById('start-overlay');

        document.getElementById('btn-start-ar').addEventListener('click', () => {
            if ('xr' in navigator) {
                navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                    if (supported) {
                        startARSession();
                    } else {
                        alert("WebXR 'immersive-ar' tidak didukung di perangkat/browser ini.");
                    }
                });
            } else {
                alert("Browser Anda tidak mendukung WebXR.");
            }
        });

        function startARSession() {
            startOverlay.style.display = 'none';
            
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Pencahayaan
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            // Reticle (Indikator titik target di lantai)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Kontrol Input Ketuk Layar (Select)
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelectTap);
            scene.add(controller);

            // Konfigurasi Sesi WebXR AR
            const sessionInit = {
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.getElementById('ar-ui') }
            };

            navigator.xr.requestSession('immersive-ar', sessionInit).then((session) => {
                renderer.xr.setSession(session);
                session.addEventListener('end', () => {
                    startOverlay.style.display = 'flex';
                });
            });

            window.addEventListener('resize', onWindowResize, false);
            renderer.setAnimationLoop(render);
        }

        // Fungsi saat layar diketuk (Menaruh Titik A atau B)
        function onSelectTap() {
            if (reticle.visible) {
                const position = new THREE.Vector3();
                const quaternion = new THREE.Quaternion();
                const scale = new THREE.Vector3();
                reticle.matrix.decompose(position, quaternion, scale);

                if (!pointA) {
                    // Set Titik Awal (A)
                    pointA = position.clone();
                    markerMeshA = createMarker(pointA, 0x10b981); // Hijau
                    scene.add(markerMeshA);
                    instructionText.textContent = "Titik A dipasang. Geser HP ke sudut lain lalu ketuk untuk Titik B.";
                } else if (!pointB) {
                    // Set Titik Akhir (B)
                    pointB = position.clone();
                    markerMeshB = createMarker(pointB, 0xef4444); // Merah
                    scene.add(markerMeshB);

                    // Buat Garis Penghubung (Line 3D)
                    drawMeasurementLine(pointA, pointB);

                    // Hitung Jarak Jaringan 3D
                    const distanceMeters = pointA.distanceTo(pointB);
                    const distanceCm = distanceMeters * 100;
                    
                    distanceCard.classList.remove('hidden');
                    btnReset.classList.remove('hidden');
                    distanceOutput.textContent = distanceCm >= 100 ? `${distanceMeters.toFixed(2)} m` : `${distanceCm.toFixed(1)} cm`;
                    instructionText.textContent = "Pengukuran selesai!";
                    reticle.visible = false;
                }
            }
        }

        function createMarker(pos, colorHex) {
            const geometry = new THREE.SphereGeometry(0.02, 32, 32);
            const material = new THREE.MeshBasicMaterial({ color: colorHex });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.copy(pos);
            return sphere;
        }

        function drawMeasurementLine(start, end) {
            const material = new THREE.LineBasicMaterial({ color: 0xf59e0b, linewidth: 5 });
            const points = [start, end];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            measuringLine = new THREE.Line(geometry, material);
            scene.add(measuringLine);
        }

        // Tombol Reset Pengukuran
        btnReset.addEventListener('click', () => {
            if (markerMeshA) scene.remove(markerMeshA);
            if (markerMeshB) scene.remove(markerMeshB);
            if (measuringLine) scene.remove(measuringLine);
            
            pointA = null;
            pointB = null;
            markerMeshA = null;
            markerMeshB = null;
            measuringLine = null;

            distanceCard.classList.add('hidden');
            btnReset.classList.add('hidden');
            instructionText.textContent = "Arahkan kamera ke lantai hingga lingkaran putih muncul, lalu ketuk.";
        });

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((referenceSpace) => {
                        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource && !pointB) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
