<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f1f5f9;

    min-height: 100vh;
  }
  .header {

<script>

/* ================================================================
   LOGIKA LAYAR KUNCI PIN ADMIN
   ================================================================ */
let currentPinAdmin = '';
const DEFAULT_PIN_ADMIN = '081006'; // PIN Bawaan Admin (Silakan ganti)

// Cek saat halaman dimuat
window.addEventListener('load', () => {
  const isUnlocked = sessionStorage.getItem('dashboard_unlocked');
  if (isUnlocked === 'true') {
    document.getElementById('lockscreenAdmin').style.display = 'none';
  } else {
    // Sembunyikan konten dashboard sementara
    document.querySelector('.container').style.display = 'none';
  }
});

function enterPinAdmin(val) {
  if (val === 'C') {
    currentPinAdmin = '';
    updatePinDotsAdmin();
    return;
  }
  if (val === 'DEL') {
    currentPinAdmin = currentPinAdmin.slice(0, -1);
    updatePinDotsAdmin();
    return;
  }

  if (currentPinAdmin.length < 6) {
    currentPinAdmin += val;
    updatePinDotsAdmin();
  }

  if (currentPinAdmin.length === 6) {
    const savedPin = localStorage.getItem('dashboard_pin') || DEFAULT_PIN_ADMIN;
    
    if (currentPinAdmin === savedPin) {
      // Jika benar
      sessionStorage.setItem('dashboard_unlocked', 'true');
      const lockScreen = document.getElementById('lockscreenAdmin');
      lockScreen.style.transition = 'opacity 0.3s';
      lockScreen.style.opacity = '0';
      setTimeout(() => { 
        lockScreen.style.display = 'none'; 
        document.querySelector('.container').style.display = 'block';
        loadDashboard(); // Muat data setelah terbuka
      }, 300);
    } else {
      // Jika salah
      const dots = document.getElementById('pinDotsAdmin');
      dots.classList.add('shake');
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      setTimeout(() => {
        dots.classList.remove('shake');
        currentPinAdmin = '';
        updatePinDotsAdmin();
      }, 400);
    }
  }
}

function updatePinDotsAdmin() {
  const dots = document.querySelectorAll('.pin-dot-admin');
  dots.forEach((dot, index) => {
    if (index < currentPinAdmin.length) {
      dot.classList.add('active');
    } else {
      dot.classList.remove('active');
    }
  });
}

function gantiPinAdmin() {
  const oldPin = prompt('Masukkan PIN Lama Admin:');
  const savedPin = localStorage.getItem('dashboard_pin') || DEFAULT_PIN_ADMIN;
  
  if (oldPin === savedPin) {
    const newPin = prompt('Masukkan PIN Baru (6 Angka):');
    if (newPin && newPin.length === 6 && !isNaN(newPin)) {
      localStorage.setItem('dashboard_pin', newPin);
      alert('✅ PIN Admin berhasil diubah!');
    } else {
      alert('❌ PIN baru harus 6 angka!');
    }
  } else if (oldPin !== null) {
    alert('❌ PIN Lama salah!');
  }
}

const DASHBOARD_API = 'https://script.google.com/macros/s/AKfycbxveayx7vBte7OTIzQcjLppSt1LQu6hw57_z9NyFGpwudJSTs4a2tY5614R4JEpxf-W/exec?action=dashboard';

let chartPetugas = null;
let chartKondisi = null;

async function loadDashboard() {
  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading"><div class="spinner"></div><p>Memuat data...</p></div>`;

  try {
    const response = await fetch(DASHBOARD_API, { redirect: 'follow' });
    const result = await response.json();

    if (result.status !== 'success') {
      throw new Error(result.message || 'Gagal memuat');
    }

    renderDashboard(result.data);
    document.getElementById('updated').textContent =
      'Diperbarui: ' + new Date().toLocaleTimeString('id-ID');
  } catch (err) {
    content.innerHTML = `<div class="error">❌ Gagal memuat: ${err.message}</div>`;
    console.error(err);
  }
}

function fmtDist(m) {
  if (m < 1000) return m.toFixed(1) + ' m';
  return (m / 1000).toFixed(2) + ' km';
}

function renderDashboard(data) {
  const content = document.getElementById('content');

  const petugasCount = data.petugas.length;
  const ruasCount = data.ruas.length;
  const totalTitik = data.totalTitik;
  const totalPanjang = data.totalPanjang;

function renderCharts(data) {
  const ctx1 = document.getElementById('chartPetugas').getContext('2d');
  if (chartPetugas) chartPetugas.destroy();
  chartPetugas = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: data.petugas.map(p => p.nama),
      datasets: [{
        label: 'Jumlah Titik',
        data: data.petugas.map(p => p.titik),
        backgroundColor: '#0ea5e9',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });

  const ctx2 = document.getElementById('chartKondisi').getContext('2d');
  if (chartKondisi) chartKondisi.destroy();
  chartKondisi = new Chart(ctx2, {
    type: 'doughnut',
    data: {
      labels: ['Baik', 'Sedang', 'Rusak Ringan', 'Rusak Berat'],
      datasets: [{
        data: [
          data.kondisi.baik || 0,
          data.kondisi.sedang || 0,
          data.kondisi.rr || 0,
          data.kondisi.rb || 0
        ],
        backgroundColor: ['#22c55e', '#eab308', '#f97316', '#ef4444']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom' } }
    }
  });
}

function safeDateStr(v, opts) {
  if (!v) return '-';
  const d = new Date(v);
  if (isNaN(d.getTime())) return '-';
  return d.toLocaleString('id-ID', opts || {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'mm', 'a4');
    const pageW = 210, pageH = 297, margin = 15;
    let y = margin;

    // ================= HEADER =================
    doc.setFillColor(14, 165, 233);
    doc.rect(0, 0, pageW, 28, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(16);
    doc.setFont('helvetica', 'bold');
    doc.text('LAPORAN MONEV INFRASTRUKTUR KEC. SIRAMPOG', pageW / 2, 13, { align: 'center' });
    doc.setFontSize(10);
    doc.setFont('helvetica', 'normal');
    doc.text('Monitoring & Evaluasi Kondisi Infrastruktur', pageW / 2, 21, { align: 'center' });

    y = 38;
    doc.setTextColor(30, 41, 59);
    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    
    const splitTitle = doc.splitTextToSize(ruasInfo.nama, pageW - (margin * 2));
    doc.text(splitTitle, margin, y);
    y += (splitTitle.length * 6) + 2;

    const firstPt = pts[0] || {};
    
    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    const infoLines = [
      `Desa: ${firstPt.desa || '-'}  |  Tahun: ${firstPt.tahun || '-'}`,
      `Sumber Dana: ${firstPt.sumberDana || '-'}`,
      `Lokasi: ${firstPt.kategori || '-'}`,
      `Kondisi Ruas: ${ruasInfo.kondisi.toUpperCase()}  |  Tanggal Monev: ${firstPt.tanggalMonev ? new Date(firstPt.tanggalMonev).toLocaleDateString('id-ID') : '-'}`
    ];
    infoLines.forEach(line => {
      doc.text(line, margin, y);
      y += 5;
    });
    
    const fAnggaran = Number(firstPt.anggaran || 0).toLocaleString('id-ID');
    const fRealisasi = Number(firstPt.realisasi || 0).toLocaleString('id-ID');
    doc.text(`Anggaran: Rp ${fAnggaran}  |  Realisasi: Rp ${fRealisasi}  |  Progress: ${firstPt.progress || 0}%`, margin, y);
    y += 8;

    // ================= RINGKASAN =================
    const fotoCount = pts.filter(p => p.fotoUrl).length;
    const kondisiCount = { baik: 0, sedang: 0, rr: 0, rb: 0 };
    pts.forEach(p => { if (p.kondisiSegmen) kondisiCount[p.kondisiSegmen]++; });

    doc.setFillColor(240, 249, 255);
    doc.rect(margin, y, pageW - margin * 2, 30, 'F');
    doc.setFontSize(10);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(14, 165, 233);
    doc.text('RINGKASAN PENGUKURAN', margin + 4, y + 7);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(30, 41, 59);
    doc.setFontSize(9);
    doc.text(`Total Panjang Terukur: ${(ruasInfo.panjang ).toFixed(2)} m`, margin + 4, y + 14);
    doc.text(`Jumlah Titik: ${pts.length}`, margin + 4, y + 20);
    doc.text(`Jumlah Foto: ${fotoCount}`, margin + 4, y + 26);
    y += 35;

    // ================= PETA OSM DINAMIS =================
  if (y > pageH - 100) { doc.addPage(); y = margin; }
  loadingToast.textContent = '⏳ Mengunduh gambar peta jalan...';
  doc.setFontSize(10);
  doc.setFont('helvetica', 'bold');
  doc.setTextColor(14, 165, 233);
  doc.text('PETA LOKASI KEGIATAN', margin, y);
  y += 5;

  try {
    const canvas = document.createElement('canvas');
    canvas.width = 800;
    canvas.height = 400;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const lats = pts.map(p => p.lat);
    const lons = pts.map(p => p.lon);
    const minLat = Math.min(...lats);
    const maxLat = Math.max(...lats);
    const minLon = Math.min(...lons);
    const maxLon = Math.max(...lons);
    
    const centerLat = (minLat + maxLat) / 2;
    const centerLon = (minLon + maxLon) / 2;

    const latDiff = maxLat - minLat;
    const lonDiff = maxLon - minLon;
    let zoom = 17; 
    if (latDiff > 0.05 || lonDiff > 0.05) zoom = 14; 
    else if (latDiff > 0.02 || lonDiff > 0.02) zoom = 15; 
    else if (latDiff > 0.01 || lonDiff > 0.01) zoom = 16; 
    else if (latDiff === 0 && lonDiff === 0) zoom = 19; 

    const getGlobalPixel = (lat, lon, z) => {
      const scale = 256 * Math.pow(2, z);
      const x = (lon + 180) / 360 * scale;
      const rad = (lat * Math.PI) / 180;
      const y = (1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * scale;
      return { x, y };
    };

    const centerGlobal = getGlobalPixel(centerLat, centerLon, zoom);
    const topLeftX = centerGlobal.x - (canvas.width / 2);
    const topLeftY = centerGlobal.y - (canvas.height / 2);

    const minTileX = Math.floor(topLeftX / 256);
    const maxTileX = Math.floor((topLeftX + canvas.width) / 256);
    const minTileY = Math.floor(topLeftY / 256);
    const maxTileY = Math.floor((topLeftY + canvas.height) / 256);

    const tiles = [];
    for (let tx = minTileX; tx <= maxTileX; tx++) {
      for (let ty = minTileY; ty <= maxTileY; ty++) {
        const url = `https://tile.openstreetmap.org/${zoom}/${tx}/${ty}.png`;
        
        tiles.push(new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = "Anonymous";
          img.onload = () => {
            const px = (tx * 256) - topLeftX;
            const py = (ty * 256) - topLeftY;
            ctx.drawImage(img, px, py, 256, 256);
            resolve();
          };
          img.onerror = () => resolve();
          img.src = url;
        }));
      }
    }

    await Promise.all(tiles);
	  
    const toCanvasXY = (lat, lon) => {
      const globalPos = getGlobalPixel(lat, lon, zoom);
      const x = globalPos.x - topLeftX;
      const yPos = globalPos.y - topLeftY;
      return [x, yPos];
    };

    ctx.strokeStyle = '#0ea5e9';
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach((p, i) => {
      const [x, yPos] = toCanvasXY(p.lat, p.lon);
      if (i === 0) ctx.moveTo(x, yPos);
      else ctx.lineTo(x, yPos);
    });
    ctx.stroke();

    pts.forEach((p, i) => {
      const [x, yPos] = toCanvasXY(p.lat, p.lon);
      ctx.beginPath();
      ctx.arc(x, yPos, 8, 0, Math.PI * 2);
      
      if (i === 0) ctx.fillStyle = '#10b981'; // Hijau (Awal)
      else if (i === pts.length - 1) ctx.fillStyle = '#ef4444'; // Merah (Akhir)
      else ctx.fillStyle = '#f59e0b'; // Kuning (Tengah)
      
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.stroke();
    });

    const mapImgData = canvas.toDataURL('image/jpeg', 0.9);
    const mapW = pageW - margin * 2;
    const mapH = mapW * 0.5; 
    
    doc.setDrawColor(200, 200, 200);
    doc.rect(margin, y, mapW, mapH);
    doc.addImage(mapImgData, 'JPEG', margin, y, mapW, mapH);
    y += mapH + 8;

  } catch (e) {
    console.warn('Peta gagal dimuat:', e);
    doc.setDrawColor(200); doc.rect(margin, y, pageW - margin * 2, 40);
    doc.setFontSize(8); doc.setTextColor(150);
    doc.text('Peta tidak dapat dimuat.', margin + 10, y + 20);
    y += 48;
  }

    // ================= TABEL TITIK =================
    if (y > pageH - 60) { doc.addPage(); y = margin; }
    doc.setFontSize(10);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(14, 165, 233);
    doc.text('TABEL TITIK KOORDINAT', margin, y);
    y += 3;

    const tableRows = pts.map((p, i) => [
      p.noTitik || (i + 1),
      p.lat.toFixed(6),
      p.lon.toFixed(6),
      (p.akurasi || 0).toFixed(0) + ' m',
      i > 0 ? p.jarakSegmen.toFixed(1) + ' m' : '-',
      p.kondisiSegmen ? p.kondisiSegmen.toUpperCase() : '-'
    ]);

    doc.autoTable({
      startY: y + 2,
      head: [['No', 'Latitude', 'Longitude', 'Akurasi', 'Jarak Segmen', 'Kondisi']],
      body: tableRows,
      theme: 'grid',
      margin: { left: margin, right: margin },
      styles: { fontSize: 8, cellPadding: 2 },
      headStyles: { fillColor: [14, 165, 233], textColor: 255, fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [240, 249, 255] },
      columnStyles: {
        0: { cellWidth: 12, halign: 'center' },
        1: { cellWidth: 32 },
        2: { cellWidth: 32 },
        3: { cellWidth: 22, halign: 'center' },
        4: { cellWidth: 28, halign: 'right' },
        5: { cellWidth: 'auto', halign: 'center' }
      }
    });
    y = doc.lastAutoTable.finalY + 8;

    // ================= FOTO DOKUMENTASI =================
    const photoPoints = pts.filter(p => p.fotoUrl);
    if (photoPoints.length > 0) {
      doc.addPage();
      y = margin;
      doc.setFontSize(10);
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(14, 165, 233);
      doc.text('DOKUMENTASI FOTO KONDISI', margin, y);
      y += 8;

      const imgW = (pageW - margin * 2 - 4) / 2;
      const imgH = imgW * 0.7;
      let col = 0;

      for (const p of photoPoints) {
        loadingToast.textContent = `⏳ Mengunduh foto titik #${p.noTitik}...`;

        let imgData = null;
        try {
          const match = p.fotoUrl.match(/[-\w]{25,}/);
          if (match) {
            const fileId = match[0];
            const proxyUrl = `https://images.weserv.nl/?url=drive.google.com/thumbnail?id=${fileId}%26sz=w1000`;
            
            imgData = await new Promise((resolve, reject) => {
              const img = new Image();
              img.crossOrigin = "Anonymous"; 
              img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                resolve(canvas.toDataURL('image/jpeg', 0.8));
              };
              img.onerror = () => reject(new Error('Gagal load image via proxy'));
              img.src = proxyUrl;
            });
          }
        } catch (err) {
          console.warn('Gagal unduh foto:', p.fotoUrl, err);
        }

        if (y + imgH + 20 > pageH - margin) { doc.addPage(); y = margin; col = 0; }
        const x = margin + col * (imgW + 4);

        if (imgData) {
          try {
            doc.addImage(imgData, 'JPEG', x, y, imgW, imgH);
          } catch (e) {
            doc.setDrawColor(200); doc.rect(x, y, imgW, imgH);
            doc.setFontSize(8); doc.text('Foto gagal dimuat', x + 10, y + 15);
          }
        } else {
          doc.setDrawColor(200); doc.rect(x, y, imgW, imgH);
          doc.setFontSize(8); doc.setTextColor(150);
          doc.text('Foto tidak tersedia', x + 10, y + 15);
        }

        doc.setFontSize(8);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(30, 41, 59);
        doc.text(`Titik #${p.noTitik}`, x + 1, y + imgH + 4);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7);
        doc.text(`${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}`, x + 1, y + imgH + 8);
        if (p.kondisiSegmen) doc.text(`Kondisi: ${p.kondisiSegmen.toUpperCase()}`, x + 1, y + imgH + 12);
        if (p.keterangan) {
          const lines = doc.splitTextToSize(p.keterangan, imgW - 2);
          doc.text(lines.slice(0, 2), x + 1, y + imgH + 16);
        }

        col++;
        if (col >= 2) { col = 0; y += imgH + 22; }
      }
      if (col > 0) y += imgH + 22;
    }

    // ================= TTD =================
    if (y > pageH - 60) { doc.addPage(); y = margin; }
    else y = Math.max(y + 10, pageH - 60);

    doc.setFontSize(9);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(30, 41, 59);
    doc.text(`Dibuat: ${new Date().toLocaleDateString('id-ID')}`, margin, y);

    const ttdX = pageW - margin - 60;
    doc.text('Petugas Pengukur,', ttdX, y);
    doc.setFont('helvetica', 'bold');
    doc.text(petugas, ttdX, y + 30);
    doc.setFont('helvetica', 'normal');
    doc.text(`NIP: ${nip}`, ttdX, y + 36);

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFontSize(7);
      doc.setTextColor(148, 163, 184);
      doc.text(`PMD Kec. Sirampog - Monev Infrastruktur · ${ruasInfo.nama}`, pageW / 2, pageH - 8, { align: 'center' });
      doc.text(`Halaman ${i} dari ${pageCount}`, pageW - margin, pageH - 8, { align: 'right' });
    }

    doc.save(`Laporan-${ruasInfo.nama.replace(/[^a-zA-Z0-9]/g, '-')}-${new Date().toISOString().slice(0,10)}.pdf`);
    loadingToast.textContent = '✅ PDF berhasil dibuat!';
    setTimeout(() => loadingToast.remove(), 2000);

  } catch (err) {
    console.error(err);
    loadingToast.textContent = '❌ Gagal membuat PDF: ' + err.message;
    setTimeout(() => loadingToast.remove(), 3000);
  }
}

function openBeritaAcara(namaRuas) {
  if (!currentData || !currentData.rawPoints) return;
  
  const ruasInfo = currentData.ruas.find(r => r.nama === namaRuas);
  if (!ruasInfo) return;

  const pts = currentData.rawPoints.filter(p => p.ruas === namaRuas).sort((a, b) => a.noTitik - b.noTitik);
  if (pts.length === 0) { alert('Ruas ini belum memiliki data pengukuran.'); return; }
  
  const firstPt = pts[0] || {};

  document.getElementById('baRuasId').value = namaRuas;
  document.getElementById('baTanggal').value = firstPt.tanggalMonev || new Date().toISOString().split('T')[0];
  document.getElementById('baPetugas').value = '';
  document.getElementById('baDesa').value = '';
  document.getElementById('baCatatan').value = ruasInfo.catatanMonev || '';
  
  document.getElementById('modalBeritaAcara').style.display = 'flex';
}

let dashMap = null;
let dashMarkersLayer = null;

function renderPetaDashboard(data) {
  if (!data.rawPoints || data.rawPoints.length === 0) return;

  const grouped = {};
  data.rawPoints.forEach(p => {
    if (!grouped[p.ruas]) {
      grouped[p.ruas] = {
        nama: p.ruas,
        desa: p.desa || '-',
        tahun: p.tahun || '-',
        progress: Number(p.progress) || 0,
        anggaran: Number(p.anggaran) || 0,
        lat: p.lat,
        lon: p.lon
      };
    }
  });

  const locations = Object.values(grouped).filter(loc => loc.lat && loc.lon);

  if (!dashMap) {
    dashMap = L.map('dashboardMap').setView([-7.2041, 109.0624], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(dashMap);
    dashMarkersLayer = L.layerGroup().addTo(dashMap);
  } else {
    // Jika peta sudah ada, hapus marker lama & reset view
    dashMarkersLayer.clearLayers();
    dashMap.invalidateSize(); 
  }

  locations.forEach(item => {
    let pulseClass = 'marker-pulse-red';
    if (item.progress >= 100) pulseClass = 'marker-pulse-green';
    else if (item.progress > 0) pulseClass = 'marker-pulse-yellow';

    const customIcon = L.divIcon({
      className: 'custom-div-icon',
      html: `<div class="${pulseClass}" style="width: 20px; height: 20px;"></div>`,
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });

    const marker = L.marker([item.lat, item.lon], { icon: customIcon }).addTo(dashMarkersLayer);
    
    const popupContent = `
      <div style="font-family:'Segoe UI',sans-serif;min-width:200px;">
        <h4 style="margin:0 0 4px;font-size:0.95em;">${item.nama}</h4>
        <p style="margin:0 0 8px;font-size:0.8em;color:#64748b;">📍 ${item.desa} (${item.tahun})</p>
        <div style="font-size:0.8em;margin-bottom:4px;"><strong>Progress:</strong> ${item.progress}%</div>
        <div style="font-size:0.8em;"><strong>Anggaran:</strong> Rp ${item.anggaran.toLocaleString('id-ID')}</div>
      </div>
    `;
    marker.bindPopup(popupContent);
  });

  if (locations.length > 0) {
    const bounds = L.latLngBounds(locations.map(l => [l.lat, l.lon]));
    dashMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
